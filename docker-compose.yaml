services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
    volumes:
      - ./backend/prisma:/app/prisma
    
  frontend:
    build: ./frontend
    ports:
      - "4173:4173"
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL}
    depends_on:
      - backend
  
volumes:
  backend-data: